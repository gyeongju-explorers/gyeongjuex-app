name: ✨ 기능 제안
description: 새로운 기능이나 개선 사항을 제안합니다.
title: '[Feat] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 배경 / 문제 상황
      description: 왜 이 기능이 필요한가요? 어떤 문제를 해결하나요?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 어떤 기능을 어떻게 구현하고 싶은지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려했던 다른 방법이 있다면 적어주세요.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 참고 자료
      description: 참고할 만한 디자인, 링크, 스크린샷 등이 있다면 첨부해주세요.
    validations:
      required: false
