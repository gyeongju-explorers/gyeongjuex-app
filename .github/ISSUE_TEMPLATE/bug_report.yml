name: 🐛 버그 리포트
description: 앱에서 발견한 버그를 신고합니다.
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 재현하는 순서를 단계별로 적어주세요.
      placeholder: |
        1. '...'로 이동
        2. '...' 클릭
        3. 에러 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 원래 어떻게 동작해야 하는지 설명해주세요.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷 / 로그
      description: 스크린샷이나 에러 로그가 있다면 첨부해주세요.
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: 기기 / 환경
      placeholder: '예: Pixel 8 에뮬레이터, Android 14, Expo Go'
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - '낮음 (사소한 UI 문제)'
        - '보통 (일부 기능 오작동)'
        - '높음 (핵심 기능 동작 불가)'
        - '긴급 (앱 크래시/실행 불가)'
    validations:
      required: true
