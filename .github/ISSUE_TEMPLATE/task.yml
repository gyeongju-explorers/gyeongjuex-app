name: ✅ 작업 (Task)
description: 화면 개발, 데이터 연동 등 진행할 작업을 등록합니다.
title: '[Task] '
labels: ['task']
body:
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 무엇을 해야 하는지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: 세부 체크리스트
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 관련 디자인 시안, 문서, 이슈 링크 등
    validations:
      required: false
